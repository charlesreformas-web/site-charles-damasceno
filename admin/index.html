<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Painel — Charles Damasceno Reformas</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="shell">
    <section id="loginView" class="card login-card">
      <div class="brand">CD</div>
      <h1>Painel do site</h1>
      <p>Entre com sua conta para administrar fotos e textos. Este painel não guarda senha no navegador.</p>
      <form id="loginForm">
        <label>E-mail<input id="email" type="email" autocomplete="username" required></label>
        <label>Senha<input id="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Entrar</button>
      </form>
      <div id="loginMsg" class="msg"></div>
    </section>

    <section id="appView" hidden>
      <header class="topbar">
        <div><strong>Charles Damasceno</strong><span>Painel administrativo</span></div>
        <button id="logoutBtn" class="ghost">Sair</button>
      </header>

      <div class="grid">
        <section class="card">
          <div class="section-head"><div><h2>Fotos das obras</h2><p>Adicione, edite a descrição, publique ou remova fotos.</p></div><label class="upload">+ Adicionar fotos<input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden></label></div>
          <div id="uploadMsg" class="msg"></div>
          <div id="photosList" class="photos"></div>
        </section>

        <section class="card">
          <div class="section-head"><div><h2>Textos principais</h2><p>Altere os textos sem editar HTML.</p></div><button id="saveTextBtn">Salvar textos</button></div>
          <div id="textMsg" class="msg"></div>
          <div class="fields">
            <label>Chamada pequena<input data-key="hero.eyebrow"></label>
            <label>Título 1<input data-key="hero.title1"></label>
            <label>Título 2<input data-key="hero.title2"></label>
            <label>Título 3<input data-key="hero.title3"></label>
            <label>Descrição<textarea data-key="hero.description"></textarea></label>
            <label>Texto do botão<input data-key="hero.cta"></label>
            <label>Título da galeria<input data-key="gallery.title"></label>
            <label>Descrição da galeria<textarea data-key="gallery.description"></textarea></label>
          </div>
        </section>
      </div>
    </section>
  </main>
  <script src="../assets/site-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js" defer></script>
</body>
</html>
